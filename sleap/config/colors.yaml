standard:
# The first 7 colors are the MATLAB default palette, kept unchanged so that
# projects look the same as they always have. Since the palette cycles, those
# 7 alone meant that track 8 was drawn in exactly the same color as track 1,
# which made projects with ~10+ tracks very hard to read.
#
# The remaining colors extend the palette by greedy farthest-point sampling in
# CIEDE2000 (perceptual) color space, so each added color is as far as possible
# from every color before it. Candidates were restricted to L* 45-85 and
# chroma >= 38 to stay legible over both dark and bright video.
#
# Minimum pairwise CIEDE2000 distance: 24.0 at 12 colors, 18.9 at 16, 14.8 at
# all 28 (a distance of ~2.3 is the just-noticeable difference).
- 0,114,189  # blue
- 217,83,25  # orange
- 237,177,32  # gold
- 126,47,142  # purple
- 119,172,48  # green
- 77,190,238  # light blue
