# Continuous integration
name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "sleap/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
      - develop
    paths:
      - "sleap/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"

jobs:
  # Lint with ruff
  lint:
    # This job runs:
    #
    # 1. Linting and formatting checks with ruff
    #
    # Note: This uses Google-style docstring convention
    # Ref: https://google.github.io/styleguide/pyguide.html
    name: Lint
    runs-on: "ubuntu-latest"
    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup UV
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Run ruff checks
      run: |
        uv run ruff check sleap tests
    
    - name: Run ruff format check
      run: |
        uv run ruff format --check sleap tests

  # Tests with pytest
  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "windows", "mac"]
        # os: ["ubuntu", "windows", "mac", "self-hosted-gpu"]
        include:
          - os: ubuntu
            runs-on: ubuntu-latest
          - os: windows
            runs-on: windows-latest
          - os: mac
            runs-on: macos-latest
          # - os: self-hosted-gpu
          #   runs-on: [self-hosted, puma, gpu, 2xgpu]
        python: [3.12]

    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Print environment info
        run: |
          uv run python --version
          uv run pip freeze

      - name: Install graphics dependencies on Ubuntu
        # https://github.com/conda-forge/opencv-feedstock/issues/401
        # TODO(2025-08): Test if this is still needed with the latest versions of the dependencies.
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb1 \
            libxcb-util1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-randr0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libx11-xcb1 \
            libxext6 \
            libxi6 \
            libxrender1 \
            libxrandr2 \
            libfontconfig1 \
            libdbus-1-3 \
            libfreetype6 \
            libegl1 \
            libgl1

      - name: Test with pytest (with coverage) on Ubuntu
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        # env:
        #   PYTHONFAULTHANDLER: "1"
        #   QT_QPA_PLATFORM: "offscreen"
        run: |
          uv run pytest --cov=sleap --cov-report=xml --durations=-1 tests/ -v

      - name: Test with pytest (with coverage) on Windows/Mac
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: |
          uv run pytest --cov=sleap --cov-report=xml --durations=-1 tests/

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}
